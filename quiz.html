<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fef9f0">
  <title>はたらくくるま クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- スタートオーバーレイ（iOS Safari TTS対応） -->
  <div id="start-overlay" class="start-overlay">
    <div class="start-overlay-content">
      <div style="font-size:64px">🚗</div>
      <p style="font-size:28px;font-weight:bold;color:#1e293b">タップしてはじめる</p>
    </div>
  </div>

  <!-- クイズセクション -->
  <div id="quiz-section" class="quiz-screen">
    <div class="quiz-header">
      <p id="question-text" class="question-text" aria-live="polite"></p>
      <button id="speak-btn" class="speak-btn" aria-label="もう一度聞く">🔊</button>
    </div>
    <div id="vehicle-grid" class="vehicle-grid"></div>
    <div id="progress" class="progress-text" aria-live="polite"></div>
  </div>

  <!-- 結果セクション（初期は非表示） -->
  <div id="result-section" class="result-screen hidden">
    <div class="result-emoji">🎉</div>
    <h2 class="result-title">よくできました！</h2>
    <button id="replay-btn" class="btn btn-replay">🔁 もう一度あそぶ</button>
    <a href="index.html" class="btn btn-home">🏠 おわる</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
