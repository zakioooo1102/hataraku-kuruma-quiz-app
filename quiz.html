<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>はたらくくるま クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- クイズセクション -->
  <div id="quiz-section" class="quiz-screen">
    <div class="quiz-header">
      <div id="question-text" class="question-text"></div>
      <button id="speak-btn" class="speak-btn" aria-label="もう一度聞く">🔊</button>
    </div>
    <div id="vehicle-grid" class="vehicle-grid"></div>
    <div id="progress" class="progress-text"></div>
  </div>

  <!-- 結果セクション（初期は非表示） -->
  <div id="result-section" class="result-screen hidden">
    <div class="result-emoji">🎉</div>
    <div class="result-title">よくできました！</div>
    <button id="replay-btn" class="btn btn-replay">🔁 もう一度あそぶ</button>
    <a href="index.html" class="btn btn-home">🏠 おわる</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
