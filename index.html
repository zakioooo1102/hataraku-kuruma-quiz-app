<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fef9f0">
  <title>はたらくくるま クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ホーム画面 -->
  <div id="home-section" class="home-screen">
    <div class="home-icon">🚗</div>
    <h1 class="home-title">はたらくくるま<br>クイズ</h1>
    <button id="start-btn" class="btn btn-start">🎮 はじめる</button>
  </div>

  <!-- クイズセクション -->
  <div id="quiz-section" class="quiz-screen hidden">
    <div class="quiz-header">
      <p id="question-text" class="question-text" aria-live="polite"></p>
      <button id="speak-btn" class="speak-btn" aria-label="もう一度聞く">🔊</button>
    </div>
    <div id="vehicle-grid" class="vehicle-grid"></div>
    <div id="progress" class="progress-text" aria-live="polite"></div>
  </div>

  <!-- 正解オーバーレイ -->
  <div id="correct-overlay" class="correct-overlay hidden">
    <div class="correct-content">
      <div class="correct-mark">⭕️</div>
      <div class="correct-label">せいかい！</div>
      <img id="correct-img" class="correct-img" alt="">
      <div id="correct-name" class="correct-name"></div>
      <button id="next-btn" class="btn btn-next">つぎのもんだいへ ▶</button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result-section" class="result-screen hidden">
    <div class="result-emoji">🎉</div>
    <h2 class="result-title">よくできました！</h2>
    <button id="replay-btn" class="btn btn-replay">🔁 もう一度あそぶ</button>
    <button id="home-btn" class="btn btn-home">🏠 おわる</button>
  </div>

  <script src="app.js"></script>
  <script>
    // ピンチズーム防止（iOS 10+対応）
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // ダブルタップズーム防止
    let lastTap = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });
  </script>
</body>
</html>
